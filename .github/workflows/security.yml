name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC: catches new CVEs in code that hasn't changed
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static analysis of our own code: XSS, injection, prototype pollution, unsafe
  # regex, insecure randomness, path traversal... and unsafe patterns in workflows.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities in installed npm packages.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Fails on high/critical advisories; lower ones are printed but don't block.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Checks npm registry signatures so a tampered package can't slip in.
      - name: Verify package signatures
        run: |
          npm ci --ignore-scripts
          npm audit signatures

  # Leaked passwords, API keys and tokens (npm, AWS, GitHub, Slack...) in commits.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so old commits are scanned too

      - uses: trufflesecurity/trufflehog@v3.100.1
        with:
          extra_args: --results=verified,unknown

  # On pull requests: blocks new dependencies with known vulnerabilities.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
