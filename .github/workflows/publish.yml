name: Publish to npm

# Release: bump "version" in packages/ui/package.json, commit, then
#   git tag ui-v3.0.0 && git push origin ui-v3.0.0
on:
  push:
    tags: ["ui-v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    name: Publish @scopesky/ui
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Node 24 ships npm 11, which supports trusted publishing.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./packages/ui/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          expected="ui-v${{ steps.pkg.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/ui/package.json (expected $expected)."
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "@scopesky/ui@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::warning::@scopesky/ui@${{ steps.pkg.outputs.version }} is already published. Nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # "prepack" builds the package (icons, TypeScript, CSS) before it is packed.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: npm publish -w @scopesky/ui --access public --provenance
        env:
          # Repo secret (Settings → Secrets and variables → Actions). Never commit the token itself.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
